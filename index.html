<style>
:root{--bg:#eef3f7;--card:#ffffff;--ink:#10273a;--ink2:#4a6276;--soft:#dfe8f0;--line:#c9d7e3;--acc:#123a57;--acc-ink:#fff;--link:#145d92;--focus:#2563eb;color-scheme:light}

/* ===== Piezas comunes de los juegos (indalo-apps) ===== */
*{box-sizing:border-box}
html[data-fs="s"]{font-size:15px} html,html[data-fs="m"]{font-size:17px} html[data-fs="l"]{font-size:19px} html[data-fs="xl"]{font-size:21px} html[data-fs="xxl"]{font-size:24px}
html,body{margin:0;height:100%}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Nunito",sans-serif;background:var(--bg);color:var(--ink);

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Pantalla de menú */
#menu{min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.m-wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1}

.nov h4{margin:14px 0 4px}

.steps{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;counter-increment:st}
.steps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.steps svg{width:20px;height:20px;vertical-align:-4px;stroke:var(--link);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kbd{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0 6px;font-weight:700}
.hintbox{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.howto{margin:8px 0 0;padding-left:20px}.howto li{margin:6px 0}
#barra-act{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:60;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:.9rem;padding:9px 16px;border-radius:999px;box-shadow:0 6px 20px -8px rgb(0 0 0 / .5)}

/* Pantalla de juego */
#juego{position:fixed;inset:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#juego canvas{display:block;width:100%;height:100%}
.hud-btn{position:absolute;z-index:5;width:48px;height:48px;border-radius:50%;border:0;background:rgb(0 0 0 / .35);color:#fff;font-size:1.3rem;font-weight:800;display:grid;place-items:center;backdrop-filter:blur(4px)}
.over{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px;background:rgb(0 0 0 / .45)}
.over[hidden]{display:none}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:22px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px -20px rgb(0 0 0 / .6);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card h2{margin:0 0 6px;font-size:1.6rem}
.card .big{font-size:3rem;font-weight:900;margin:6px 0;font-variant-numeric:tabular-nums}
.card .row{justify-content:center;margin-top:16px}
.card .btn{min-width:130px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

  <div id="install-slot"></div>

<script>
const CFG={"repo": "tejo-indalo", "pre": "ti", "nombre": "Tejo del Indalo", "corto": "Tejo del Indalo", "color": "#123a57", "aviso": "Juego de habilidad para entretenerse. El Indalo es un símbolo prehistórico de Almería; el dibujo de los discos es propio de la app.", "soporte": "https://github.com/indalo-apps/tejo-indalo/issues"};
const NOVEDADES=[["1.0.1",["📲 Ayuda para instalar al día con iOS 27: el botón de tres rayas dentro de la barra de la dirección"]],
  ["1.0", ["🥏 Primera versión: desliza tus discos del Indalo hasta la zona de 3 puntos", "💥 Empuja los discos del rival fuera del tablero o al pozo", "🤖 Contra la máquina, en tres niveles: Fácil, Normal y Difícil", "👥 Dos jugadores en el mismo móvil, cada uno en su orilla", "⌨️ También se juega con el teclado", "📲 Se instala en el móvil, funciona sin conexión y se actualiza sola"]]];
window.APP={};
/* ===================== PIEZAS COMUNES (indalo-apps) ===================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const P=CFG.pre;                       // prefijo de las claves guardadas en el móvil
const VERSION=(document.querySelector('meta[name="app-version"]')||{}).content||"dev";
const AUTORES="Adela Moreno Vega y Carlos Moreno Otto";
const APP=window.APP||{};               // ganchos que define cada juego
function anunciar(t){const r=$('#sr');r.textContent='';setTimeout(()=>{r.textContent=t},30)}
function verCmp(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}
const REDUCIR=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
// Márgenes del área segura (isla, barra de inicio) en píxeles, para dibujar en el lienzo
const _sa=document.createElement('div');_sa.setAttribute('aria-hidden','true');
_sa.style.cssText='position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(_sa);
function safe(l){return parseFloat(getComputedStyle(_sa)['padding'+l[0].toUpperCase()+l.slice(1)])||0}

/* ---------- Preferencias y aspecto ---------- */
let PREF=Object.assign({fs:'m',theme:'auto',sound:true,vibra:true},store.get(P+'-pref-v1',{}));
function guardarPref(){store.set(P+'-pref-v1',PREF)}
function applyLook(){const r=document.documentElement;r.dataset.fs=PREF.fs;
  const dark=PREF.theme==='dark'||(PREF.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme=dark?'dark':'light';
  $$('meta[name="theme-color"]').forEach(m=>m.remove());
  const m=document.createElement('meta');m.name='theme-color';m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||CFG.color;document.head.appendChild(m);
  if(APP.onLook)APP.onLook();}
applyLook();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook);

/* ---------- Sonido y vibración ---------- */
let AC=null;
function audio(){if(!PREF.sound)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null}return AC}
addEventListener('pointerdown',()=>{if(PREF.sound)audio()},{once:true,capture:true});
function tono(f,d=.12,tipo='sine',vol=.18,f2=null,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function ruido(d=.2,vol=.25,corte=1200){const a=audio();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
  for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=corte;
  const g=a.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(a.destination);s.start();}
function vibrar(p){if(PREF.vibra&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* ---------- Hojas (ventanas que suben desde abajo) ---------- */
let sheetOpener=null,skipPop=false;
function openSheet(html,label){const s=$('#sheet');
  s.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${label}"><div class="grab"></div><button class="x-close" data-close="btn" aria-label="Cerrar">✕</button>${html}</div></div>`;
  s.hidden=false;if(!sheetOpener||!document.body.contains(sheetOpener))sheetOpener=document.activeElement;
  if(!(history.state&&history.state.sheet))history.pushState({sheet:1,juego:!!(history.state&&history.state.juego)},'');
  const sh=s.querySelector('.sheet');sh.tabIndex=-1;sh.focus({preventScroll:true});if(APP.onSheet)APP.onSheet(true);}
function closeSheet(fromPop){const s=$('#sheet');if(s.hidden)return;s.hidden=true;s.innerHTML='';
  if(sheetOpener&&document.body.contains(sheetOpener))sheetOpener.focus({preventScroll:true});sheetOpener=null;

/* ===================== JUEGO ===================== */
/* Tejo del Indalo: desliza tus discos hasta la zona de puntos */
const cv=$('#cv'),ctx=cv.getContext('2d');
const R=7,HOYO=8,ORILLA=22,MU=22,DISCOS=4,META=12;   // unidades del tablero: 100 de ancho
const COL=[{n:'Azul',c:'#2b6fd0',o:'#174a96',t:'#9cc6ff'},{n:'Rojo',c:'#c8452f',o:'#8a2b1c',t:'#ffb1a3'}];
let W=0,H=0,DPR=1,L=190,ESC=3,BX=0,BY=0,SA={top:0,bottom:0},IMG=[];
function medir(){SA={top:safe('top'),bottom:safe('bottom')};DPR=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const aw=W-12,ah=H-SA.top-SA.bottom-8;L=Math.max(150,Math.min(210,100*ah/aw));ESC=Math.min(aw/100,ah/L);BX=(W-100*ESC)/2;BY=SA.top+4+(ah-L*ESC)/2;
  IMG=COL.map(c=>disco(c));}
addEventListener('resize',()=>{if(!$('#juego').hidden&&S){const vL=L;medir();if(Math.abs(vL-L)>.5)S.discos.forEach(d=>{d.y*=L/vL})}});
const px=x=>BX+x*ESC,py=y=>BY+y*ESC;
const mitad=()=>L/2,largo=()=>L/2-ORILLA;

/* ---------- Disco con el Indalo (se dibuja una vez) ---------- */
function disco(c){const s=Math.ceil(R*2*ESC*DPR)+4,k=document.createElement('canvas');k.width=k.height=s;const g=k.getContext('2d'),m=s/2,r=R*ESC*DPR;
  const gr=g.createRadialGradient(m-r*.3,m-r*.35,r*.1,m,m,r);gr.addColorStop(0,c.c);gr.addColorStop(1,c.o);
  g.fillStyle=gr;g.beginPath();g.arc(m,m,r,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=r*.08;g.beginPath();g.arc(m,m,r*.86,0,7);g.stroke();
  // Indalo: cabeza, brazos, arco, cuerpo y piernas
  g.strokeStyle='#fff';g.fillStyle='#fff';g.lineCap='round';g.lineWidth=r*.11;const u=r*.13;
  g.beginPath();g.arc(m,m-3.2*u,.9*u,0,7);g.fill();
  g.beginPath();g.moveTo(m-3.6*u,m-1.5*u);g.lineTo(m+3.6*u,m-1.5*u);g.moveTo(m,m-2.2*u);g.lineTo(m,m+1.6*u);
  g.moveTo(m,m+1.6*u);g.lineTo(m-1.6*u,m+4.4*u);g.moveTo(m,m+1.6*u);g.lineTo(m+1.6*u,m+4.4*u);g.stroke();
  g.beginPath();g.arc(m,m-1.2*u,4.2*u,Math.PI*1.04,Math.PI*1.96);g.stroke();
  return k;}

/* ---------- Física ---------- */
function mover(ds,dt){for(const d of ds){if(d.fuera)continue;const v=Math.hypot(d.vx,d.vy);if(v>0){const nv=Math.max(0,v-MU*dt-v*.95*dt);d.vx*=nv/v;d.vy*=nv/v}
    d.x+=d.vx*dt;d.y+=d.vy*dt;
    if(Math.hypot(d.x-50,d.y-mitad())<HOYO-1.5&&Math.hypot(d.vx,d.vy)<75){d.fuera='pozo';d.vx=d.vy=0}
    else if(d.x<-R*.4||d.x>100+R*.4||d.y<-R*.4||d.y>L+R*.4){d.fuera='borde'}}
  for(let i=0;i<ds.length;i++){const a=ds[i];if(a.fuera)continue;for(let j=i+1;j<ds.length;j++){const b=ds[j];if(b.fuera)continue;
    const dx=b.x-a.x,dy=b.y-a.y,dd=dx*dx+dy*dy;if(dd>=4*R*R||dd===0)continue;const d=Math.sqrt(dd),nx=dx/d,ny=dy/d,sol=2*R-d;
    a.x-=nx*sol/2;a.y-=ny*sol/2;b.x+=nx*sol/2;b.y+=ny*sol/2;
    const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const im=-(1+.9)*rv/2;a.vx-=im*nx;a.vy-=im*ny;b.vx+=im*nx;b.vy+=im*ny;a.choque=b.choque=Math.max(a.choque||0,-rv)}}}}
const quieto=ds=>ds.every(d=>d.fuera||Math.hypot(d.vx,d.vy)<.6);
function limpiar(ds){for(const d of ds)if(!d.fuera&&(d.y<ORILLA-R*.3||d.y>L-ORILLA+R*.3))d.fuera='orilla';for(const d of ds)if(!d.fuera){d.vx=d.vy=0}}
function valor(d){if(d.fuera)return 0;const p=d.j===0?mitad()-d.y:d.y-mitad(),h=largo();if(p<=h/4)return 0;return p<=h/2?1:p<=3*h/4?2:3}
function puntos(ds){const p=[0,0];for(const d of ds)p[d.j]+=valor(d);return p}

/* ---------- Partida ---------- */
let S=null,raf=0,tPrev=0;
let NIVEL=store.get(P+'-nivel',1);
const victorias=()=>store.get(P+'-vic',[0,0,0]);
function nueva(modo){medir();S={modo,total:[0,0],ronda:0,empieza:1,discos:[],fase:'',turno:0,lanzados:[0,0],mano:null,hist:[],teclado:false,apunta:{a:0,f:.55},txt:[]};nuevaRonda()}
function nuevaRonda(){S.ronda++;S.empieza=1-S.empieza;S.discos=[];S.lanzados=[0,0];S.turno=S.empieza;S.txt=[];turno()}
function turno(){const j=S.turno;if(S.lanzados[0]>=DISCOS&&S.lanzados[1]>=DISCOS){finRonda();return}
  if(S.lanzados[j]>=DISCOS){S.turno=1-j;return turno()}
  S.mano={j,x:50,y:j===0?L-ORILLA/2:ORILLA/2,vx:0,vy:0};S.fase='colocar';S.apunta={a:0,f:.55};
  anunciar(S.modo==='ia'?(j===0?`Tu turno. Te quedan ${DISCOS-S.lanzados[0]} discos.`:'Turno de la máquina.'):`Turno del ${COL[j].n}.`);
  if(esIA(j))setTimeout(jugarIA,650);}
const esIA=j=>S.modo==='ia'&&j===1;

function lanzar(vx,vy){const m=S.mano;if(!m)return;const v=Math.hypot(vx,vy),max=330;if(v>max){vx*=max/v;vy*=max/v}
  S.discos.push({j:m.j,x:m.x,y:m.y,vx,vy});S.lanzados[m.j]++;S.mano=null;S.fase='mov';tono(260,.08,'triangle',.15);ruido(.15,.05,700);vibrar(10);}

function finTiro(){limpiar(S.discos);S.discos=S.discos.filter(d=>!d.fuera);S.turno=1-S.turno;turno()}
function finRonda(){S.fase='recuento';const p=puntos(S.discos);S.ultima=p;S.total[0]+=p[0];S.total[1]+=p[1];
  for(const d of S.discos){const v=valor(d);if(v)S.txt.push({x:d.x,y:d.y,s:'+'+v,c:COL[d.j].t,t:0})}
  p[0]+p[1]?[0,.1,.2].forEach((dl,i)=>tono(660+i*220,.18,'triangle',.15,null,dl)):tono(300,.3,'sine',.12);
  setTimeout(()=>{if(!S)return;const t=S.total,fin=(t[0]>=META||t[1]>=META)&&t[0]!==t[1];
    const nombre=j=>S.modo==='ia'?(j?'La máquina':'Tú'):COL[j].n;
    if(fin){S.fase='final';const g=t[0]>t[1]?0:1;
      if(S.modo==='ia'&&g===0){const v=victorias();v[NIVEL]++;store.set(P+'-vic',v)}
      tarjeta(S.modo==='ia'?(g===0?'🏆 ¡Has ganado!':'Gana la máquina'):`🏆 ¡Gana el ${COL[g].n}!`,`${t[0]} – ${t[1]}`,`${COL[0].n} – ${COL[1].n}`,
        S.modo==='ia'?`Nivel ${['Fácil','Normal','Difícil'][NIVEL]} · Victorias: ${victorias()[NIVEL]}`:'','Otra partida');
      if(g===0||S.modo==='2j')[523,659,784,1046].forEach((f,i)=>tono(f,.25,'triangle',.18,null,i*.12));}
    else{S.fase='entre';tarjeta(`Ronda ${S.ronda}`,`${t[0]} – ${t[1]}`,`${COL[0].n} – ${COL[1].n} · gana quien llegue a ${META}`,
      `Esta ronda: ${nombre(0)} +${p[0]} · ${nombre(1)} +${p[1]}`,'Siguiente ronda')}},1300);}
function tarjeta(t,b,s,e,boton){$('#f-t').textContent=t;$('#f-big').textContent=b;$('#f-sub').textContent=s;$('#f-extra').textContent=e;$('#b-otra').textContent=boton;
  $('#o-fin').hidden=false;$('#b-otra').focus();anunciar(`${t}. ${b}. ${e}`)}

/* ---------- La máquina ---------- */
function simular(ds,nuevo){const c=ds.map(d=>({...d}));c.push({...nuevo});for(let k=0;k<900;k++){mover(c,1/150);if(quieto(c))break}limpiar(c);return c}
function jugarIA(){if(!S||S.fase!=='colocar'||!esIA(S.turno))return;
  const cfg=[{n:25,sv:.22,sa:.09},{n:60,sv:.12,sa:.05},{n:200,sv:.05,sa:.02}][NIVEL];
  let mejor=null,mv=-1e9;const y=ORILLA/2;
  for(let i=0;i<cfg.n;i++){const x=R+Math.random()*(100-2*R),a=(Math.random()-.5)*.5,v=130+Math.random()*140;
    const vx=Math.sin(a)*v,vy=Math.cos(a)*v;const c=simular(S.discos,{j:1,x,y,vx,vy});const p=puntos(c);
    const val=(p[1]-p[0])+Math.random()*.3;if(val>mv){mv=val;mejor={x,vx,vy}}}
  const ruidoV=1+(Math.random()*2-1)*cfg.sv,ra=(Math.random()*2-1)*cfg.sa;
  const vx=mejor.vx*Math.cos(ra)-mejor.vy*Math.sin(ra),vy=mejor.vx*Math.sin(ra)+mejor.vy*Math.cos(ra);
  const x0=S.mano.x,t0=performance.now();
  (function deslizar(){if(!S||!S.mano)return;const k=Math.min(1,(performance.now()-t0)/450);S.mano.x=x0+(mejor.x-x0)*(k*(2-k));
    if(k<1)requestAnimationFrame(deslizar);else setTimeout(()=>{if(S&&S.mano&&S.fase==='colocar')lanzar(vx*ruidoV,vy*ruidoV)},250)})();}

/* ---------- Bucle y dibujo ---------- */
function paso(t){raf=requestAnimationFrame(paso);const dt=Math.min(.05,(t-(tPrev||t))/1000);tPrev=t;if(!S)return;
  if(S.fase==='mov'){const n=Math.ceil(dt/(1/240));for(let i=0;i<n;i++)mover(S.discos,dt/n);
    for(const d of S.discos){if(d.choque){if(d.choque>8){tono(500+Math.random()*200,.05,'square',Math.min(.2,d.choque/600));vibrar(8)}d.choque=0}
      if(d.fuera&&!d.anim){d.anim=t;if(d.fuera==='pozo'){tono(400,.35,'sine',.18,90)}else tono(220,.2,'triangle',.1,110)}}
    if(quieto(S.discos)){S.fase='espera';setTimeout(()=>{if(S&&S.fase==='espera')finTiro()},350)}}
  S.txt.forEach(f=>f.t+=dt);dibujar(t);}

function dibujar(t){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0b1824';ctx.fillRect(0,0,W,H);if(!S)return;
  const x0=px(0),y0=py(0),bw=100*ESC,bh=L*ESC,h=largo();
  // Mármol
  const g=ctx.createLinearGradient(x0,y0,x0+bw,y0+bh);g.addColorStop(0,'#f4f1ea');g.addColorStop(.5,'#e9e4da');g.addColorStop(1,'#f2eee6');ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(x0,y0,bw,bh,10);ctx.fill();
  ctx.save();ctx.beginPath();ctx.roundRect(x0,y0,bw,bh,10);ctx.clip();
  ctx.strokeStyle='rgba(120,110,100,.12)';ctx.lineWidth=1.2;for(let i=0;i<9;i++){ctx.beginPath();const yy=y0+bh*(i+.5)/9;ctx.moveTo(x0,yy);ctx.bezierCurveTo(x0+bw*.3,yy-20,x0+bw*.6,yy+25,x0+bw,yy-8);ctx.stroke()}
  // Zonas de puntos: arriba las del azul, abajo las del rojo
  for(const j of [0,1])for(let b=1;b<=3;b++){const a=h/4*b,yA=j===0?mitad()-a-h/4:mitad()+a;const ya=py(yA),hh=h/4*ESC;
    ctx.fillStyle=j===0?`rgba(43,111,208,${.06+b*.07})`:`rgba(200,69,47,${.06+b*.07})`;ctx.fillRect(x0,ya,bw,hh);
    ctx.save();ctx.translate(x0+bw-16,ya+hh/2);if(j===1&&S.modo==='2j')ctx.rotate(Math.PI);ctx.fillStyle=j===0?'rgba(23,74,150,.45)':'rgba(138,43,28,.45)';ctx.font=`900 ${Math.min(30,hh*.6)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b,0,0);ctx.restore()}
  // Orillas de lanzamiento
  for(const j of [0,1]){const ya=j===0?py(L-ORILLA):y0;ctx.fillStyle=j===0?'rgba(43,111,208,.16)':'rgba(200,69,47,.16)';ctx.fillRect(x0,ya,bw,ORILLA*ESC);
    ctx.setLineDash([6,6]);ctx.strokeStyle=j===0?'rgba(23,74,150,.6)':'rgba(138,43,28,.6)';ctx.lineWidth=2;ctx.beginPath();const yl=j===0?ya:ya+ORILLA*ESC;ctx.moveTo(x0,yl);ctx.lineTo(x0+bw,yl);ctx.stroke();ctx.setLineDash([])}
  ctx.strokeStyle='rgba(16,39,58,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,py(mitad()));ctx.lineTo(x0+bw,py(mitad()));ctx.stroke();
  ctx.restore();
  // Pozo
  const hx=px(50),hy=py(mitad());const pg=ctx.createRadialGradient(hx,hy,0,hx,hy,HOYO*ESC);pg.addColorStop(0,'#000');pg.addColorStop(.75,'#1c1612');pg.addColorStop(1,'#5a4a3c');
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(hx,hy,HOYO*ESC,0,7);ctx.fill();ctx.strokeStyle='#b49a6a';ctx.lineWidth=2;ctx.stroke();
  // Discos
  const r=R*ESC,sz=IMG[0].width/DPR;
  for(const d of S.discos){let k=1,al=1;if(d.fuera){const e=(t-(d.anim||t))/350;if(e>=1)continue;k=d.fuera==='pozo'?1-e*.8:1;al=1-e}
    ctx.globalAlpha=al;ctx.save();ctx.translate(px(d.x),py(d.y));if(d.j===1&&S.modo==='2j')ctx.rotate(Math.PI);ctx.scale(k,k);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(1.5,3,r,r*.92,0,0,7);ctx.fill();ctx.drawImage(IMG[d.j],-sz/2,-sz/2,sz,sz);ctx.restore();ctx.globalAlpha=1;
    if(S.fase==='recuento'||S.fase==='entre'||S.fase==='final'){const v=valor(d);if(v){ctx.strokeStyle='#ffd34d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px(d.x),py(d.y),r+3,0,7);ctx.stroke()}}}
  if(S.mano){const m=S.mano,pulse=1+Math.sin(t/220)*.04;ctx.save();ctx.translate(px(m.x),py(m.y));if(m.j===1&&S.modo==='2j')ctx.rotate(Math.PI);ctx.scale(pulse,pulse);
    ctx.drawImage(IMG[m.j],-sz/2,-sz/2,sz,sz);ctx.restore();
    if(S.teclado&&!esIA(m.j)){const s=m.j===0?-1:1,a=S.apunta.a,len=(20+S.apunta.f*60)*ESC;ctx.strokeStyle='rgba(16,39,58,.7)';ctx.lineWidth=3;ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(px(m.x),py(m.y));ctx.lineTo(px(m.x)+Math.sin(a)*len,py(m.y)+s*Math.cos(a)*len);ctx.stroke();ctx.setLineDash([])}}
  // Textos +N
  for(const f of S.txt){if(f.t>4)continue;ctx.save();ctx.translate(px(f.x),py(f.y)-r-10-Math.min(1,f.t*3)*8);ctx.font='900 18px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.s,0,0);ctx.fillStyle='#ffd34d';ctx.fillText(f.s,0,0);ctx.restore()}
  // Marcadores en cada orilla
  for(const j of [0,1]){const rot=j===1&&S.modo==='2j';ctx.save();const yc=j===0?py(L-ORILLA/2):py(ORILLA/2);ctx.translate(0,yc);
    if(rot){ctx.translate(W,0);ctx.rotate(Math.PI);ctx.translate(0,0)}
    const xi=rot?W-(x0+bw)+8:x0+8;const nombre=S.modo==='ia'?(j?'Máquina':'Tú'):COL[j].n;
    ctx.font='800 13px system-ui,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=COL[j].o;ctx.fillText(`${nombre} ${S.total[j]}`,xi,-7);
    for(let k=0;k<DISCOS;k++){ctx.fillStyle=k<DISCOS-S.lanzados[j]?COL[j].c:'rgba(0,0,0,.12)';ctx.beginPath();ctx.arc(xi+5+k*12,9,4.5,0,7);ctx.fill()}
    const turnoJ=S.mano&&S.mano.j===j&&!esIA(j);if(turnoJ&&!S.teclado){ctx.textAlign='right';ctx.font='700 12px system-ui,sans-serif';ctx.fillStyle=COL[j].o;ctx.fillText('Desliza ↑',(rot?W-x0:x0+bw)-8,0)}
    ctx.restore()}}

/* ---------- Controles ---------- */
let arrastre=null;
function aTablero(e){return {x:(e.clientX-BX)/ESC,y:(e.clientY-BY)/ESC,t:e.timeStamp||performance.now()}}
$('#juego').addEventListener('pointerdown',e=>{if(e.target.closest('button,.over'))return;e.preventDefault();if(!S||S.fase!=='colocar'||!S.mano||esIA(S.mano.j)||arrastre)return;
  const p=aTablero(e),j=S.mano.j;const enMitad=j===0?p.y>mitad():p.y<mitad();if(!enMitad)return;
  S.teclado=false;arrastre={id:e.pointerId,hist:[p]};cv.setPointerCapture?.(e.pointerId);colocar(p);});
function colocar(p){const m=S.mano,j=m.j;m.x=Math.max(R,Math.min(100-R,p.x));m.y=j===0?Math.max(L-ORILLA+R*.2,Math.min(L-R,p.y)):Math.max(R,Math.min(ORILLA-R*.2,p.y));}
function velocidad(h){const u=h[h.length-1];let o=h[0];for(let i=h.length-1;i>=0;i--){o=h[i];if(u.t-h[i].t>=70)break}const dt=(u.t-o.t)/1000;if(dt<.008)return {vx:0,vy:0};return {vx:(u.x-o.x)/dt*.65,vy:(u.y-o.y)/dt*.65}}
$('#juego').addEventListener('pointermove',e=>{if(!arrastre||e.pointerId!==arrastre.id||!S||!S.mano)return;const p=aTablero(e);arrastre.hist.push(p);if(arrastre.hist.length>30)arrastre.hist.shift();
  const j=S.mano.j,fuera=j===0?p.y<L-ORILLA:p.y>ORILLA;colocar(p);
  if(fuera){const v=velocidad(arrastre.hist);arrastre=null;if((j===0?-v.vy:v.vy)>25)lanzar(v.vx,v.vy)}});
function soltarDedo(e){if(!arrastre||e.pointerId!==arrastre.id)return;const h=arrastre.hist;arrastre=null;if(!S||!S.mano)return;const p=aTablero(e);h.push(p);
  const v=velocidad(h),j=S.mano.j;if((j===0?-v.vy:v.vy)>25)lanzar(v.vx,v.vy);}
$('#juego').addEventListener('pointerup',soltarDedo);$('#juego').addEventListener('pointercancel',e=>{arrastre=null});
addEventListener('keydown',e=>{if($('#juego').hidden||!$('#sheet').hidden||!S||!$('#o-fin').hidden)return;
  if(e.key==='Escape'){e.preventDefault();salir();return}
  if(S.fase!=='colocar'||!S.mano||esIA(S.mano.j))return;const m=S.mano,A=S.apunta;let ok=true;
  if(e.key==='ArrowLeft')m.x=Math.max(R,m.x-3);else if(e.key==='ArrowRight')m.x=Math.min(100-R,m.x+3);
  else if(e.key==='ArrowUp')A.f=Math.min(1,A.f+.04);else if(e.key==='ArrowDown')A.f=Math.max(.1,A.f-.04);
  else if(e.key==='a'||e.key==='A'||e.key==='q'||e.key==='Q')A.a=Math.max(-.45,A.a-.03);else if(e.key==='d'||e.key==='D'||e.key==='e'||e.key==='E')A.a=Math.min(.45,A.a+.03);
  else if(e.key===' '||e.key==='Enter'){const v=90+A.f*190,s=m.j===0?-1:1;lanzar(Math.sin(A.a)*v,s*Math.cos(A.a)*v)}else ok=false;
  if(ok){e.preventDefault();if(!S.teclado){S.teclado=true;anunciar('Flechas izquierda y derecha: mover. Arriba y abajo: fuerza. A y D: ángulo. Espacio: lanzar.')}}});

/* ---------- Pantallas ---------- */
function abrir(modo){$('#menu').hidden=true;$('#juego').hidden=false;$('#o-fin').hidden=true;history.pushState({juego:1},'');nueva(modo);tPrev=0;
  cancelAnimationFrame(raf);raf=requestAnimationFrame(paso);
  cv.setAttribute('aria-label',modo==='2j'?'Tablero para dos: azul abajo, rojo arriba. Desliza tu disco hacia la orilla contraria.':'Tablero: tus discos son los azules, abajo. Desliza el disco hacia arriba.');}
function salir(fromPop){cancelAnimationFrame(raf);S=null;arrastre=null;$('#juego').hidden=true;$('#menu').hidden=false;pintarMenu();
  if(!fromPop&&history.state&&history.state.juego){skipPop=true;history.back()}$('#b-ia').focus();}
APP.enPantallaJuego=()=>!$('#juego').hidden;
APP.enPartida=()=>!!S&&S.fase!=='final'&&(S.discos.length>0||S.ronda>1);
APP.salir=salir;
$('#b-salir').addEventListener('click',()=>salir());$('#b-menu').addEventListener('click',()=>salir());
$('#b-otra').addEventListener('click',()=>{$('#o-fin').hidden=true;if(!S)return;if(S.fase==='final')nueva(S.modo);else nuevaRonda()});
$('#b-ia').addEventListener('click',()=>abrir('ia'));$('#b-2j').addEventListener('click',()=>abrir('2j'));
$('#niveles').addEventListener('click',e=>{const b=e.target.closest('[data-niv]');if(!b)return;NIVEL=+b.dataset.niv;store.set(P+'-nivel',NIVEL);pintarMenu()});
$('#b-como').addEventListener('click',()=>openSheet(`<h2>Cómo se juega</h2>
  <ol class="howto"><li>Cada jugador tiene <b>4 discos</b> y los lanza por turnos desde <b>su orilla</b> (la franja de su color).</li>
  <li>Pon el dedo en tu orilla y <b>desliza hacia arriba</b> (hacia la orilla contraria). Cuanto más rápido deslices, más lejos llega el disco.</li>
  <li>Al pararse todos, cada disco que esté en la <b>mitad del rival</b> suma lo que marque su zona: <b>1, 2 o 3</b>. La zona de 3 es la más cercana a la orilla contraria.</li>
  <li>Puedes <b>empujar</b> los discos del rival. Lo que cae por los bordes o se queda en una orilla, se pierde. Y si un disco pasa <b>despacio</b> por el <b>pozo</b> del centro, se cae; deprisa, lo salta.</li>
  <li>Gana quien llegue antes a <b>${META} puntos</b> al final de una ronda.</li>
  <li>Con teclado: <span class="kbd">←</span> <span class="kbd">→</span> mover, <span class="kbd">↑</span> <span class="kbd">↓</span> fuerza, <span class="kbd">A</span> <span class="kbd">D</span> ángulo y <span class="kbd">Espacio</span> para lanzar.</li></ol>
  <div class="sheet-nav"><button class="btn block" data-close="btn">¡A jugar!</button></div>`,'Cómo se juega'));
function pintarMenu(){$$('[data-niv]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.niv===NIVEL));const v=victorias();
  $('#records').innerHTML=v.some(Boolean)?['Fácil','Normal','Difícil'].map((n,i)=>v[i]?`<span class="rec">🏆 ${n}: ${v[i]}</span>`:'').join(''):'';}
pintarMenu();

arrancarComun();
</script>
</body>
</html>
